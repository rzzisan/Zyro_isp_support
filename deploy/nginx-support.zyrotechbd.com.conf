server {
    listen 80;
    listen [::]:80;
    server_name support.zyrotechbd.com www.support.zyrotechbd.com;
    return 301 https://support.zyrotechbd.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name support.zyrotechbd.com;

    ssl_certificate     /etc/letsencrypt/live/wildcard-zyrotechbd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard-zyrotechbd/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8993;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
