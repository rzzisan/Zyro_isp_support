; Zyro Desk voice bot (repo deploy/asterisk). Only the companies' PBX extensions live here, written by
; engine/voice_bot.py into /var/lib/zyro-voice/pjsip_zyro.conf. No anonymous endpoint: any other INVITE is refused.
[global]
type=global
user_agent=ZyroDesk
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5075

#tryinclude /var/lib/zyro-voice/pjsip_zyro.conf

; WhatsApp calls (Meta Calling API over SIP): Meta connects here with TLS. The certificate is desk.zyrotechbd.com's
; Let's Encrypt one, copied for Asterisk by deploy/asterisk/cert-hook.sh. allow_reload: a renewed certificate is
; picked up by "pjsip reload". The meta-wa endpoint itself is written by engine/voice_bot.py.
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/zyro-sip.crt
priv_key_file=/etc/asterisk/keys/zyro-sip.key
method=tlsv1_2
allow_reload=yes
