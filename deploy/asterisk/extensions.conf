; Zyro Desk voice bot (repo deploy/asterisk). Every call from a company's PBX extension comes here (the office phones
; ring at the same time). The engine (engine/voice_bot.py, /mode) answers "bot:<uuid>:<seconds>" (rings in Desk, then
; the bot picks it up after that many seconds), "ring:<uuid>" (rings in Desk until someone takes it) or "ring" (this
; extension only rings). While it rings, Desk staff allowed "phone" take it from the softphone (take-<uuid>, as for
; WhatsApp calls below); an office phone answering or the caller hanging up ends this leg and the hangup handler.
[zyro-in]
exten => _[0-9a-zA-Z*#+].,1,Goto(s,1)
exten => s,1,Set(TIMEOUT(absolute)=14400)   ; no call stays up more than 4 h, whatever goes wrong
 same => n,Set(PLAN=${CURL(http://127.0.0.1:8997/mode?ep=${CHANNEL(endpoint)}&caller=${URIENCODE(${CALLERID(num)})})})
 same => n,Set(KIND=${CUT(PLAN,:,1)})
 same => n,Set(UID=${CUT(PLAN,:,2)})
 same => n,GotoIf($["${KIND}" = "ivr"]?ivr)
 same => n,GotoIf($["${UID}" != ""]?desk)
 same => n,Ringing()
 same => n,Wait(300)
 same => n,Hangup()
 same => n(ivr),Ringing()   ; line off for the bill: the line-off flow picks it up after a moment (engine/voice_ivr.py inbound)
 same => n,Wait(${CUT(PLAN,:,3)})
 same => n,Goto(zyro-remind,${UID},1)
 same => n(desk),Set(CHANNEL(hangup_handler_push)=zyro-ended,s,1(${UID}))
 same => n,Ringing()
 same => n,Set(DEADLINE=$[${EPOCH} + ${IF($["${KIND}" = "bot"]?${CUT(PLAN,:,3)}:300)}])
 same => n(wait),GotoIf(${DB_EXISTS(zyrotake/${UID})}?take)
 same => n,GotoIf($[${EPOCH} < ${DEADLINE}]?pause)
 same => n,GotoIf($["${KIND}" != "bot"]?giveup)
 same => n,GotoIf($["${CURL(http://127.0.0.1:8997/bot?uid=${UID})}" = "ok"]?answer)
 same => n,GotoIf($[${EPOCH} > ${DEADLINE} + 60]?giveup)
 same => n(pause),Wait(0.5)
 same => n,Goto(wait)
 same => n(take),Set(AGENT=${DB_DELETE(zyrotake/${UID})})
 same => n,Answer()
 same => n,MixMonitor(/var/spool/asterisk/zyro-rec/${UID}.wav)
 same => n,Bridge(${AGENT},x)
 same => n,Hangup()
 same => n(answer),Answer()
 same => n,Set(TIMEOUT(absolute)=900)   ; a bot call ends by 10 min (MAX_CALL) + margin
 same => n,AudioSocket(${UID},127.0.0.1:9093)
 same => n,Hangup()
 same => n(giveup),Hangup()

; WhatsApp calls from Meta (endpoint meta-wa, written by engine/voice_bot.py). /mode?wa=<the number dialed> answers
; "bot:<uuid>:<seconds>" or "busy" (calling off for that number, or a caller outside the test numbers).
; While it rings, Desk staff allowed "phone" can take it from the softphone (context zyro-agent dials take-<uuid>; the
; engine picks the first one and the agent's channel puts itself in AstDB zyrotake/<uuid>, which this loop bridges to).
; When the seconds run out and /bot still says "ok" (nobody took it), the voice bot answers.
[zyro-wa]
exten => _[+0-9s]!,1,Set(TIMEOUT(absolute)=14400)   ; no call stays up more than 4 h, whatever goes wrong
 same => n,Set(PLAN=${CURL(http://127.0.0.1:8997/mode?wa=${URIENCODE(${EXTEN})}&caller=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($["${CUT(PLAN,:,1)}" = "bot"]?bot)
 same => n,GotoIf($["${CUT(PLAN,:,1)}" = "ivr"]?ivr)
 same => n,Busy(5)
 same => n,Hangup(17)
 same => n(ivr),Ringing()   ; line off for the bill: the line-off flow (as in zyro-in)
 same => n,Wait(${CUT(PLAN,:,3)})
 same => n,Goto(zyro-remind,${CUT(PLAN,:,2)},1)
 same => n(bot),Set(UID=${CUT(PLAN,:,2)})
 same => n,Set(CHANNEL(hangup_handler_push)=zyro-ended,s,1(${UID}))
 same => n,Ringing()
 same => n,Set(DEADLINE=$[${EPOCH} + ${CUT(PLAN,:,3)}])
 same => n(wait),GotoIf(${DB_EXISTS(zyrotake/${UID})}?take)
 same => n,GotoIf($[${EPOCH} < ${DEADLINE}]?pause)
 same => n,GotoIf($["${CURL(http://127.0.0.1:8997/bot?uid=${UID})}" = "ok"]?answer)
 same => n,GotoIf($[${EPOCH} > ${DEADLINE} + 60]?giveup)
 same => n(pause),Wait(0.5)
 same => n,Goto(wait)
 same => n(take),Set(AGENT=${DB_DELETE(zyrotake/${UID})})
 same => n,Answer()
 same => n,MixMonitor(/var/spool/asterisk/zyro-rec/${UID}.wav)
 same => n,Bridge(${AGENT},x)
 same => n,Hangup()
 same => n(answer),Answer()
 same => n,Set(TIMEOUT(absolute)=900)   ; a bot call ends by 10 min (MAX_CALL) + margin
 same => n,AudioSocket(${UID},127.0.0.1:9093)
 same => n,Hangup()
 same => n(giveup),Hangup(19)

; Desk softphone calls (endpoints a<sip_agents.id>, browser or app). take-<uuid>: take a ringing WhatsApp call (the
; engine says "ok" to the first allowed member; then wait here until the WhatsApp side bridges to us). A mobile number:
; call the customer through the company's hotline extension (endpoint c<company>), recorded.
[zyro-agent]
exten => _take-.,1,Set(UID=${EXTEN:5})
 same => n,GotoIf($["${CURL(http://127.0.0.1:8997/take?uid=${URIENCODE(${UID})}&agent=${CHANNEL(endpoint)})}" != "ok"]?gone)
 same => n,Answer()
 same => n,Set(DB(zyrotake/${UID})=${CHANNEL})
 same => n,Wait(20)
 same => n,Hangup()
 same => n(gone),Hangup(21)
exten => _[+0-9].,1,Set(R=${CURL(http://127.0.0.1:8997/out?agent=${CHANNEL(endpoint)}&to=${URIENCODE(${EXTEN})})})
 same => n,GotoIf($["${CUT(R,:,1)}" != "ok"]?no)
 same => n,Set(UID=${CUT(R,:,2)})
 same => n,Set(CHANNEL(hangup_handler_push)=zyro-ended,s,1(${UID}))
 same => n,MixMonitor(/var/spool/asterisk/zyro-rec/${UID}.wav)
 same => n,Dial(PJSIP/${CUT(R,:,4)}@${CUT(R,:,3)},60)
 same => n,Hangup()
 same => n(no),Hangup(21)

; hangup handler of hotline, WhatsApp and outgoing staff calls: the engine closes the call_logs row and saves the recording
[zyro-ended]
exten => s,1,Set(X=${CURL(http://127.0.0.1:8997/ended?uid=${ARG1}&secs=${ANSWEREDTIME})})
 same => n,Return()

; Voice reminder calls (Desk → ভয়েস রিমাইন্ডার, engine/voice_ivr.py). The voice bot runs
;   channel originate Local/<uid>@zyro-remind-dial extension <uid>@zyro-remind
; zyro-remind-dial asks /remind-dial for "ok:c<company>:<mobile>:<ring seconds>" and dials the customer through the
; company's hotline extension; how that ended goes back to /remind-dialed. When the customer answers, the other half
; of the Local channel enters zyro-remind and the flow runs over FastAGI (127.0.0.1:4574): messages, keys, SMS, line
; on, ringing Desk staff (they take it with take-<uid> as any call, AstDB zyrotake/<uid>).
[zyro-remind-dial]
exten => _[0-9a-f].,1,Set(R=${CURL(http://127.0.0.1:8997/remind-dial?uid=${EXTEN})})
 same => n,GotoIf($["${CUT(R,:,1)}" != "ok"]?no)
 same => n,Dial(PJSIP/${CUT(R,:,3)}@${CUT(R,:,2)},${CUT(R,:,4)})
 same => n,Set(X=${CURL(http://127.0.0.1:8997/remind-dialed?uid=${EXTEN}&status=${DIALSTATUS})})
 same => n,Hangup()
 same => n(no),Hangup()

[zyro-remind]
exten => _[0-9a-f].,1,Set(TIMEOUT(absolute)=1800)   ; a reminder call (with staff) ends by 30 min whatever goes wrong
 same => n,Set(CHANNEL(hangup_handler_push)=zyro-remind-ended,s,1(${EXTEN}))
 same => n,Answer()
 same => n,AGI(agi://127.0.0.1:4574/remind?uid=${EXTEN})
 same => n,Hangup()

[zyro-remind-ended]
exten => s,1,Set(X=${CURL(http://127.0.0.1:8997/remind-ended?uid=${ARG1})})
 same => n,Return()
