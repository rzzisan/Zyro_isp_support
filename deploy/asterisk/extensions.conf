; Zyro Desk voice bot (repo deploy/asterisk). Every call from a company's PBX extension comes here. The engine
; (engine/voice_bot.py, /mode) answers "bot:<uuid>:<seconds>" when the bot should pick it up after that many seconds
; of ringing, otherwise "ring": then this extension only rings, so the agents' phones take it as before.
[general]
static=yes
writeprotect=yes

[zyro-in]
exten => _[0-9a-zA-Z*#+].,1,Goto(s,1)
exten => s,1,Set(PLAN=${CURL(http://127.0.0.1:8997/mode?ep=${CHANNEL(endpoint)}&caller=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($["${CUT(PLAN,:,1)}" = "bot"]?bot)
 same => n,Ringing()
 same => n,Wait(300)
 same => n,Hangup()
 same => n(bot),Ringing()
 same => n,Wait(${CUT(PLAN,:,3)})
 same => n,Answer()
 same => n,AudioSocket(${CUT(PLAN,:,2)},127.0.0.1:9093)
 same => n,Hangup()

; WhatsApp calls from Meta (endpoint meta-wa, written by engine/voice_bot.py). /mode?wa=<the number dialed> answers
; "bot:<uuid>:<seconds>" or "busy" (calling off for that number, or a caller outside the test numbers).
; While it rings, Desk staff allowed "phone" can take it from the softphone (context zyro-agent dials take-<uuid>; the
; engine picks the first one and the agent's channel puts itself in AstDB zyrotake/<uuid>, which this loop bridges to).
; When the seconds run out and /bot still says "ok" (nobody took it), the voice bot answers.
[zyro-wa]
exten => _[+0-9s]!,1,Set(PLAN=${CURL(http://127.0.0.1:8997/mode?wa=${URIENCODE(${EXTEN})}&caller=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($["${CUT(PLAN,:,1)}" = "bot"]?bot)
 same => n,Busy(5)
 same => n,Hangup(17)
 same => n(bot),Set(UID=${CUT(PLAN,:,2)})
 same => n,Set(CHANNEL(hangup_handler_push)=zyro-ended,s,1(${UID}))
 same => n,Ringing()
 same => n,Set(DEADLINE=$[${EPOCH} + ${CUT(PLAN,:,3)}])
 same => n(wait),GotoIf(${DB_EXISTS(zyrotake/${UID})}?take)
 same => n,GotoIf($[${EPOCH} < ${DEADLINE}]?pause)
 same => n,GotoIf($["${CURL(http://127.0.0.1:8997/bot?uid=${UID})}" = "ok"]?answer)
 same => n,GotoIf($[${EPOCH} > ${DEADLINE} + 60]?giveup)
 same => n(pause),Wait(0.5)
 same => n,Goto(wait)
 same => n(take),Set(AGENT=${DB_DELETE(zyrotake/${UID})})
 same => n,Answer()
 same => n,MixMonitor(/var/spool/asterisk/zyro-rec/${UID}.wav)
 same => n,Bridge(${AGENT},x)
 same => n,Hangup()
 same => n(answer),Answer()
 same => n,AudioSocket(${UID},127.0.0.1:9093)
 same => n,Hangup()
 same => n(giveup),Hangup(19)

; Desk softphone calls (endpoints a<sip_agents.id>, browser or app). take-<uuid>: take a ringing WhatsApp call (the
; engine says "ok" to the first allowed member; then wait here until the WhatsApp side bridges to us). A mobile number:
; call the customer through the company's hotline extension (endpoint c<company>), recorded.
[zyro-agent]
exten => _take-.,1,Set(UID=${EXTEN:5})
 same => n,GotoIf($["${CURL(http://127.0.0.1:8997/take?uid=${URIENCODE(${UID})}&agent=${CHANNEL(endpoint)})}" != "ok"]?gone)
 same => n,Answer()
 same => n,Set(DB(zyrotake/${UID})=${CHANNEL})
 same => n,Wait(20)
 same => n,Hangup()
 same => n(gone),Hangup(21)
exten => _[+0-9].,1,Set(R=${CURL(http://127.0.0.1:8997/out?agent=${CHANNEL(endpoint)}&to=${URIENCODE(${EXTEN})})})
 same => n,GotoIf($["${CUT(R,:,1)}" != "ok"]?no)
 same => n,Set(UID=${CUT(R,:,2)})
 same => n,Set(CHANNEL(hangup_handler_push)=zyro-ended,s,1(${UID}))
 same => n,MixMonitor(/var/spool/asterisk/zyro-rec/${UID}.wav)
 same => n,Dial(PJSIP/${CUT(R,:,4)}@${CUT(R,:,3)},60)
 same => n,Hangup()
 same => n(no),Hangup(21)

; hangup handler of WhatsApp and outgoing staff calls: the engine closes the call_logs row and saves the recording
[zyro-ended]
exten => s,1,Set(X=${CURL(http://127.0.0.1:8997/ended?uid=${ARG1}&secs=${ANSWEREDTIME})})
 same => n,Return()
