# LiveKit signalling for the Desk app's walkie-talkie (audio itself goes to UDP 7882 / TCP 7881 directly)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rtc.zyrotechbd.com;

    ssl_certificate /etc/letsencrypt/live/wildcard-zyrotechbd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard-zyrotechbd/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }
}
